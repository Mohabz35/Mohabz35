<svg xmlns="http://www.w3.org/2000/svg" width="286" height="175" viewBox="0 0 286 175"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    .r {
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
  <rect width="286" height="175" rx="12" fill="#161b22"/>
  <rect x="0.5" y="0.5" width="285" height="174" rx="12" fill="none" stroke="#30363d"/>

  <g class="r" style="animation-delay: 0.45s">
    <!-- Tag badge -->
    <rect x="20" y="20" width="79" height="22" rx="4" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="0.75"/>
    <text x="28" y="35" font-size="11" font-weight="700" fill="#58a6ff">FINTECH</text>

    <!-- Metric -->
    <text x="20" y="80" font-size="24" font-weight="700" fill="#e6edf3">
      M-PESA <tspan font-size="14" font-weight="400" fill="#7d8590">integration</tspan>
    </text>

    <!-- Description -->
    <text x="20" y="112" font-size="12" fill="#7d8590">
      Event registration portals powered by 
    </text>
    <text x="20" y="130" font-size="12" fill="#7d8590">
      seamless M-PESA mobile payments.
    </text>
  </g>
</svg>