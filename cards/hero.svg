<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes gradient {
      0% { stop-color: #58a6ff; }
      50% { stop-color: #bc8cff; }
      100% { stop-color: #58a6ff; }
    }
    .r {
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .r, .cursor { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <rect width="880" height="230" rx="14" fill="url(#hero-bg)"/>
  <rect x="0.5" y="0.5" width="879" height="229" rx="14" fill="none" stroke="#30363d"/>

  <!-- Terminal top bar -->
  <line x1="0" y1="36" x2="880" y2="36" stroke="#30363d"/>
  <circle cx="24" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="440.0" y="22" font-size="12" fill="#7d8590" text-anchor="middle">terminal ~ @Mohabz35</text>

  <!-- Content -->
  <g class="r" style="animation-delay: 0.15s">
    <text x="36" y="78" font-size="14" fill="#7d8590">~$ whoami</text>
    <text x="36" y="118" font-size="32" font-weight="700" fill="url(#glow)">Mohammed Abbas</text>
    <rect x="309.0" y="92" width="10" height="26" fill="#39d353" class="cursor"/>
  </g>

  <g class="r" style="animation-delay: 0.3s">
    <text x="36" y="152" font-size="18" font-weight="600" fill="#e6edf3">Front-End Developer &amp; Emerging Tech Innovator</text>
    <text x="36" y="184" font-size="14" fill="#7d8590">Economics &amp; Statistics @ Chuka University • ALX Software Engineer • HealthTech &amp; FinTech Builder</text>
  </g>

  <!-- Status pill -->
  <g class="r" style="animation-delay: 0.45s">
    <rect x="700" y="65" width="144" height="28" rx="14" fill="#238636" fill-opacity="0.2" stroke="#39d353" stroke-width="0.75"/>
    <circle cx="715" cy="79" r="4" fill="#39d353"/>
    <text x="728" y="83" font-size="12" font-weight="500" fill="#39d353">AVAILABLE TO BUILD</text>
  </g>
</svg>